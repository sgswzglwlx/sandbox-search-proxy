name: Search Relay

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Search query'
        required: true
        type: string
      engine:
        description: 'Search engine'
        required: true
        type: choice
        options:
          - google
          - duckduckgo
          - brave
          - qwant
          - startpage
        default: 'google'
      count:
        description: 'Results count'
        required: false
        type: number
        default: 10

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Execute search
        run: |
          QUERY="${{ inputs.query }}"
          ENGINE="${{ inputs.engine }}"
          COUNT=${{ inputs.count }}
          
          # Build search URL based on engine
          case $ENGINE in
            google)
              URL="https://www.google.com/search?q=${QUERY}&num=${COUNT}"
              ;;
            duckduckgo)
              URL="https://html.duckduckgo.com/html/?q=${QUERY}"
              ;;
            brave)
              URL="https://search.brave.com/search?q=${QUERY}"
              ;;
            qwant)
              URL="https://www.qwant.com/?q=${QUERY}"
              ;;
            startpage)
              URL="https://www.startpage.com/sp/search?query=${QUERY}"
              ;;
          esac
          
          echo "Searching: $ENGINE for: $QUERY"
          echo "URL: $URL"
          
          # Fetch results
          curl -sL "$URL" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml" \
            -H "Accept-Language: en-US,en;q=0.9,zh-CN;q=0.8,zh;q=0.7" \
            -o search_results.html
          
          echo "Results saved. Size: $(wc -c < search_results.html) bytes"
          
          # Extract links and titles (rough extraction)
          python3 << 'PYEOF'
import re, json

with open('search_results.html', 'r', encoding='utf-8', errors='replace') as f:
    html = f.read()

results = []
seen_urls = set()

# Google specific
if "${{ inputs.engine }}" == "google":
    for m in re.finditer(r'<a[^>]*href\s*=\s*["\'](https?://[^"\']+)["\'][^>]*>(.*?)</a>', html, re.I):
        url = m.group(1)
        title = re.sub(r'<[^>]+>', '', m.group(2)).strip()
        if url not in seen_urls and title and not any(x in url for x in ['google.com/search', 'accounts.google']):
            seen_urls.add(url)
            results.append({'title': title, 'url': url})

# DuckDuckGo specific
elif "${{ inputs.engine }}" == "duckduckgo":
    for m in re.finditer(r'<a[^>]*rel\s*=\s*["\']nofollow["\'][^>]*class\s*=\s*["\']result__a["\'][^>]*href\s*=\s*["\'](https?://[^"\']+)["\'][^>]*>(.*?)</a>', html, re.I | re.S):
        url = m.group(1)
        title = re.sub(r'<[^>]+>', '', m.group(2)).strip()
        if url not in seen_urls and title:
            seen_urls.add(url)
            results.append({'title': title, 'url': url})
    if not results:
        # fallback: extract all links
        for m in re.finditer(r'<a[^>]*href\s*=\s*["\'](https?://[^"\']+)["\'][^>]*>(.*?)</a>', html, re.I):
            url = m.group(1)
            title = re.sub(r'<[^>]+>', '', m.group(2)).strip()
            if url not in seen_urls and title and 'duckduckgo.com' not in url:
                seen_urls.add(url)
                results.append({'title': title, 'url': url})

# Generic fallback
else:
    for m in re.finditer(r'<a[^>]*href\s*=\s*["\'](https?://[^"\']+)["\'][^>]*>(.*?)</a>', html, re.I):
        url = m.group(1)
        title = re.sub(r'<[^>]+>', '', m.group(2)).strip()
        domain = url.split('/')[2] if '//' in url else ''
        if url not in seen_urls and title and ENGINE not in domain:
            seen_urls.add(url)
            results.append({'title': title, 'url': url})

# Output as JSON
print(json.dumps({
    'engine': "${{ inputs.engine }}",
    'query': "${{ inputs.query }}",
    'count': len(results),
    'results': results[:${{ inputs.count }}],
    'html_size': $(wc -c < search_results.html)
}, ensure_ascii=False, indent=2))
PYEOF
          
          # Save results to a summary file for easier reading
          python3 << 'PYEOF'
import json

with open('search_results.html', 'r', encoding='utf-8', errors='replace') as f:
    html = f.read()

# Save a clean text summary
lines = []
lines.append(f"# Search Results: ${{{{ inputs.engine }}}} for \"${{{{ inputs.query }}}}\"\n")

import re
seen = set()
# Extract all meaningful links
for m in re.finditer(r'<a[^>]*href\s*=\s*["\'](https?://[^"\']+)["\'][^>]*>(.*?)</a>', html, re.I):
    url = m.group(1)
    title = re.sub(r'<[^>]+>', '', m.group(2)).strip()
    domain = url.split('/')[2] if '//' in url else ''
    if url not in seen and title and len(title) > 3 and not any(
        x in domain for x in ['google.', 'duckduckgo.', 'brave.', 'qwant.', 'startpage.']
    ):
        seen.add(url)
        lines.append(f"- {title}")
        lines.append(f"  {url}")
        lines.append("")

with open('results_summary.md', 'w') as f:
    f.write('\n'.join(lines[:60]))

print(f"Summary: {len(lines)//3} results extracted")
PYEOF

      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: |
            search_results.html
            results_summary.md
          retention-days: 1

      - name: Output summary
        run: |
          echo "## Search Results" >> $GITHUB_STEP_SUMMARY
          echo "Engine: **${{ inputs.engine }}** | Query: **${{ inputs.query }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat results_summary.md >> $GITHUB_STEP_SUMMARY || echo "No summary" >> $GITHUB_STEP_SUMMARY
