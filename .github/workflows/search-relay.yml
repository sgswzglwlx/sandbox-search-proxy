name: Search Relay
on:
  workflow_dispatch:
    inputs:
      query:
        description: Search query
        required: true
        type: string
      engine:
        description: Search engine
        required: true
        type: choice
        options: [google, duckduckgo, brave, qwant, startpage]
        default: duckduckgo
      count:
        description: Results count
        type: number
        default: 10

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search
        run: python3 search.py
        env:
          ENGINE: ${{ inputs.engine }}
          QUERY: ${{ inputs.query }}
          COUNT: ${{ inputs.count }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: |
            results.json
            results_summary.md
            search_results.html
          retention-days: 1

      - name: Summary
        run: |
          echo "## Search Results" >> $GITHUB_STEP_SUMMARY
          cat results_summary.md >> $GITHUB_STEP_SUMMARY
